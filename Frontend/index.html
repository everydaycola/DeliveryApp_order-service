<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Keep Dishes Going</title>
</head>
<body>
<nav class="navbar navbar-light navbar-expand-lg bg-light shadow px-3">
    <a class="navbar-brand" href="#">Keep Dishes Going</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href="#">Restaurants</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">My Order</a>
            </li>
        </ul>
    </div>
</nav>
<div id="app" class="container mt-4"></div>

<div class="modal fade" id="restaurantDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header" id="restaurantDetailHeader">
                <h5 class="modal-title" id="restaurantDetailTitle"></h5>
                <span class="badge bg-primary mx-5" id="typeBadge"></span>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body flex-column" id="restaurantDetailBody">
                <div id="restaurantInfo" class="d-flex justify-content-between align-items-center border rounded p-3 bg-light shadow-sm">
                    <a id="restaurantEmail" href="mailto:example@example.com" class="text-decoration-none text-primary fw-semibold">email@example.com</a>
                    <span id="restaurantAddress" class="text-secondary">123 Main Street, City</span>
                    <span id="restaurantOpen" class="badge bg-success">Open until 22:00</span>
                </div>

                <div id="restaurantMenu" class="d-flex justify-content-between align-items-center border rounded p-3 bg-light shadow-sm"></div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="/src/ts/main.ts"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
