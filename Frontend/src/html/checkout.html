<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KDG-Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-light navbar-expand-lg bg-light shadow px-3">
    <a class="navbar-brand" href="../../index.html">Keep Dishes Going</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href="../../index.html">Restaurants</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">My Order</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container py-4">
    <h2>Checkout</h2>

    <div id="orderValidation" class="alert alert-info mb-3 d-none"></div>

    <form id="checkoutForm">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="address" class="form-label">Delivery Address</label>
            <input type="text" id="address" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Contact E-mail</label>
            <input type="email" id="email" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary" id="checkoutBtn">Place Order</button>
    </form>

    <div id="finalDetails" class="mt-4 d-none">
        <h5>Order Confirmed</h5>
        <p id="finalText"></p>
    </div>
</div>

<script type="module" src="../pages/checkout.ts"></script>
</body>
</html>
